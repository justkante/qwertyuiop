name: creatify_mobile
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.4+80

environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  app_links: ^7.0.0
  camera: ^0.11.0+1
  clock: ^1.1.1
  cupertino_icons: ^1.0.6
  curl_logger_dio_interceptor: ^1.0.0
  custom_rating_bar: ^3.0.0
  device_info_plus: ^10.1.0
  dio: ^5.4.0
  dio_cache_interceptor: ^3.4.3
  dio_cache_interceptor_hive_store: ^3.2.1
  dotted_border: ^2.1.0
  envied: ^1.3.1
  equatable: ^2.0.5
  event_bus: ^2.0.1
  file_picker: ^8.0.5
  file_saver: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_dojah_kyc: ^0.6.3
  flutter_file_downloader: ^2.1.0
  flutter_image_compress: ^2.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4
  flutter_pdfview: ^1.4.3
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^9.0.0
  flutter_skeleton_ui: ^0.0.6
  flutter_slidable: ^4.0.3
  flutter_spinkit: ^5.2.0
  flutter_stripe: ^12.3.0
  flutter_styled_toast: ^2.2.1
  flutter_svg: ^2.0.9
  flutter_tawkto: ^0.0.5
  fluttertoast: ^8.2.4
  gallery_saver_plus: ^3.2.9
  geocoding: ^3.0.0
  geolocator: ^14.0.0
  get_ip_address: ^0.0.7
  get_it: ^7.2.0
  go_router: ^13.1.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.4.9
  http: ^1.2.2
  image_cropper: ^11.0.0
  image_picker: ^1.1.2
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  just_audio: ^0.10.5
  loading_animation_widget: ^1.3.0
  local_auth: ^2.2.0
  local_auth_android: ^1.0.38
  local_auth_darwin: ^1.3.1
  logging: ^1.2.0
  mixpanel_flutter: ^2.4.4
  number_text_input_formatter: ^1.0.0+8
  onesignal_flutter: ^5.3.4
  package_info_plus: ^9.0.0
  path_provider: ^2.1.3
  pdf: ^3.11.1
  permission_handler: ^11.0.0
  pinput: ^5.0.1
  pretty_dio_logger: ^1.1.1
  pusher_channels_flutter: ^2.4.0
  screenshot: ^3.0.0
  sentry_flutter: ^9.8.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.2
  showcaseview: ^5.0.1
  sign_in_with_apple: ^7.0.1
  smooth_page_indicator: ^1.1.0
  stop_watch_timer: ^3.2.1
  timelines_plus: ^1.0.4
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  video_compress: ^3.1.4
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6
  webview_flutter: ^4.10.0

dependency_overrides:
  geolocator_android: ^4.4.0
  smart_auth: ^3.2.0

dev_dependencies:
  build_runner: any
  envied_generator: ^1.1.1
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  sentry_dart_plugin: ^3.2.0

flutter_launcher_icons:
  ios: true
  android: true
  adaptive_icon_foreground: "assets/images/app_icon_square.png"
  adaptive_icon_background: "#FFFFFF"
  image_path: "assets/images/app_icon_square.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_icon.png"
  android: true
  ios: true
  android_12:
    image: "assets/images/splash_icon_12.png"
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/svg/
    - assets/fonts/
    - assets/countries.json
    - flux-mobile.yml

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: creatify
  org: maraz-develops
