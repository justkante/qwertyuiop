  build_ios:
    name: Build iOS (IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Create dummy .env file
        run: |
          echo "DOJAH_WIDGET_ID=dummy" >> .env
          echo "PROD_DOJAH_WIDGET_ID=dummy" >> .env
          echo "PUSHER_APP_KEY=dummy" >> .env
          echo "PROD_PUSHER_APP_KEY=dummy" >> .env
          echo "PUSHER_CLUSTER=dummy" >> .env
          echo "ONESIGNAL_APP_ID=dummy" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=dummy" >> .env
          echo "GOOGLE_ANDROID_CLIENT_ID=dummy" >> .env
          echo "GOOGLE_IOS_CLIENT_ID=dummy" >> .env
          echo "MIXPANEL_TOKEN=dummy" >> .env
          echo "STRIPE_PUBLISHABLE_KEY=dummy" >> .env
          echo "PROD_STRIPE_PUBLISHABLE_KEY=dummy" >> .env

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Pods
        run: |
          cd ios
          # Retry logic for network-sensitive pod install
          n=0
          until [ "$n" -ge 3 ]
          do
            pod repo update && pod install --repo-update && break
            n=$((n+1)) 
            echo "Pod install failed. Retry $n/3..."
            sleep 10
          done
          cd ..

      - name: Clean build artifacts
        run: |
          cd ios
          rm -rf Pods
          rm -rf .symlinks/
          rm -rf Flutter/Flutter.framework
          rm -rf Flutter/Flutter.podspec
          cd ..
          flutter clean

      - name: Install Apple Certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 1. Write Base64 to files using printf (Avoids YAML indentation corruption)
          printf "%s" "${{ secrets.IOS_PRIVATE_KEY_TEXT }}" > key.base64
          printf "%s" "${{ secrets.IOS_CERTIFICATE_TEXT }}" > cer.base64
          
          # 2. Decode the files
          base64 --decode -i key.base64 > release.key
          base64 --decode -i cer.base64 > release.pem
          
          # 3. Build the P12 on the Mac using ALL legacy flags required for macOS compatibility
          openssl pkcs12 -export -inkey release.key -in release.pem -out release.p12 -passout pass:build -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          
          # 4. Create temporary keychain
          security create-keychain -p "signing" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "signing" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # 5. Import the P12
          security import release.p12 -k build.keychain -P build -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "signing" build.keychain

      - name: Install Provisioning Profiles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Install Main App Profile
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | tr -d '\n ' | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Creatify_TestFlight.mobileprovision
          # Install Extension Profile
          echo "${{ secrets.EXTENSION_PROVISIONING_PROFILE_BASE64 }}" | tr -d '\n ' | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/OneSignal_TestFlight.mobileprovision

      - name: Build iOS IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define=ENVIRONMENT=prod --build-number=89
        env:
          FLUTTER_XCODE_DISABLE_SPM: true
          COCOAPODS_DISABLE_STATS: true

      - name: Get IPA path
        id: ipa_path
        run: echo "path=$(ls build/ios/ipa/*.ipa | head -n 1)" >> $GITHUB_OUTPUT

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ${{ steps.ipa_path.outputs.path }}

      - name: Upload to TestFlight
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa_path.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_P8 }}
